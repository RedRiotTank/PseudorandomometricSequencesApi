spring.application.name=PseudorandomometricSequencesApi
logging.level.htt.pseudorandomometricsequencesapi=INFO
server.forward-headers-strategy=native

# ---------------------------------------------------------------------------
# Generation limits. Every value can be overridden with an environment
# variable; Spring Boot maps API_LIMITS_MAX_SAMPLES_PER_REQUEST to
# api.limits.max-samples-per-request, and so on.
# ---------------------------------------------------------------------------

# Maximum samples (observations) per variable / per request.
api.limits.max-samples-per-request=${API_LIMITS_MAX_SAMPLES_PER_REQUEST:2000000}

# Maximum scalar values in one response (count x variables, or count x dimension).
api.limits.max-values-per-request=${API_LIMITS_MAX_VALUES_PER_REQUEST:2000000}

# Maximum number of variables in POST /sequences.
api.limits.max-variables-per-request=${API_LIMITS_MAX_VARIABLES_PER_REQUEST:100}

# Maximum dimension of a joint multivariate distribution.
api.limits.max-multivariate-dimension=${API_LIMITS_MAX_MULTIVARIATE_DIMENSION:100}

# Adaptive wall-clock budget. A small calibration prefix is used to reject
# requests that would take longer than this before doing the expensive work.
api.limits.max-generation-millis=${API_LIMITS_MAX_GENERATION_MILLIS:5000}
api.limits.calibration-samples=${API_LIMITS_CALIBRATION_SAMPLES:4096}

# Protection against floods and concurrent memory spikes.
api.limits.max-concurrent-values=${API_LIMITS_MAX_CONCURRENT_VALUES:4000000}
api.limits.max-requests-per-minute=${API_LIMITS_MAX_REQUESTS_PER_MINUTE:300}
api.limits.max-requests-per-minute-per-ip=${API_LIMITS_MAX_REQUESTS_PER_MINUTE_PER_IP:60}
api.limits.max-request-body-bytes=${API_LIMITS_MAX_REQUEST_BODY_BYTES:1048576}
api.limits.max-variable-name-length=${API_LIMITS_MAX_VARIABLE_NAME_LENGTH:128}

# ---------------------------------------------------------------------------
# HTTP server hardening and response compression.
# ---------------------------------------------------------------------------
# Response compression is opt-in: a 38 MB JSON array only shrinks to ~18 MB, but
# gzip costs several seconds of CPU. Enable it only if bandwidth matters more
# than latency, e.g. API_COMPRESSION_ENABLED=true.
server.compression.enabled=${API_COMPRESSION_ENABLED:false}
server.compression.min-response-size=${API_COMPRESSION_MIN_SIZE:1024}
server.compression.mime-types=application/json,application/*+json
server.tomcat.threads.max=${API_TOMCAT_MAX_THREADS:64}
server.tomcat.threads.min-spare=${API_TOMCAT_MIN_SPARE_THREADS:8}
server.tomcat.accept-count=${API_TOMCAT_ACCEPT_COUNT:100}
server.tomcat.max-connections=${API_TOMCAT_MAX_CONNECTIONS:1024}
server.tomcat.connection-timeout=${API_TOMCAT_CONNECTION_TIMEOUT:20s}
server.tomcat.keep-alive-timeout=${API_TOMCAT_KEEP_ALIVE_TIMEOUT:20s}
server.tomcat.max-keep-alive-requests=${API_TOMCAT_MAX_KEEP_ALIVE_REQUESTS:100}
server.tomcat.max-swallow-size=1MB
server.max-http-request-header-size=16KB
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Avoid leaking implementation details in framework-generated error responses.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
