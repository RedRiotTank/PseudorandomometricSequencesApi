version: '3.8'

services:
  pseudorandom-api:
    container_name: pseudorandom-api
    image: pseudorandom-api:latest
    # Bind to localhost by default. The reverse proxy reaches the container over
    # proxy_net, so the API does not need to expose port 8081 publicly.
    ports:
      - "${API_PORT:-127.0.0.1:8081}:8080"
    restart: always
    stop_grace_period: 30s
    mem_limit: 1536m
    memswap_limit: 1536m
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_OPTS=${JAVA_OPTS:--Xms128m -Xmx1g -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+ExitOnOutOfMemoryError}
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /api/v1/distributions HTTP/1.0\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    networks:
      - monitoring_net
    labels:
      logging_jobname: "apis"
      logging: "promtail"

networks:
  monitoring_net:
    external:
      name: monitoring
